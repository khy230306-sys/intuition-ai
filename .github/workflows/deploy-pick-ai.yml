name: Deploy PICK AI to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'DoriJitGoTtaeng-PICK-AI/**'
      - '.github/workflows/deploy-pick-ai.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-pick-ai
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DoriJitGoTtaeng-PICK-AI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: DoriJitGoTtaeng-PICK-AI/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Add SPA 404 fallback
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: DoriJitGoTtaeng-PICK-AI/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
