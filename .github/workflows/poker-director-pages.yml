name: Deploy POKER DIRECTOR Pages

on:
  push:
    branches: [main, cursor/poker-director-mvp-94a6]
    paths:
      - 'POKER_DIRECTOR/**'
      - '.github/workflows/poker-director-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-poker-director
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: POKER_DIRECTOR/package-lock.json
      - name: Install & build
        working-directory: POKER_DIRECTOR
        run: |
          npm ci
          npm run build
      - name: Stage site under /poker-director
        run: |
          mkdir -p _site/poker-director
          cp -a POKER_DIRECTOR/dist/. _site/poker-director/
          touch _site/poker-director/.nojekyll
          # root index redirects to app
          cat > _site/index.html <<'HTML'
          <!doctype html><meta http-equiv="refresh" content="0; url=./poker-director/">
          <a href="./poker-director/">POKER DIRECTOR</a>
          HTML
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
