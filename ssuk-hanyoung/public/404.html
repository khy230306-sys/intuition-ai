<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>쑥쑥놀이터</title>
    <script>
      // GitHub Pages SPA fallback: rewrite deep links to index.html
      sessionStorage.setItem('ssuk-redirect', location.pathname + location.search + location.hash)
      location.replace(location.href.replace(/\/[^/]*$/, '/') || '/')
    </script>
  </head>
  <body></body>
</html>
